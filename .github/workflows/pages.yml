name: Publish Mist Echo WebGL
on:
  push:
    branches: [main]
    paths: ['game-web.zip', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Unpack verified Unity release
        run: |
          unzip -q game-web.zip -d site
          test -f site/index.html
          test -f site/Build/stage-10-unity-web.wasm
          test -f site/Presentation/bamboo.png
          test -f site/Presentation/moon.png
          test -f site/Presentation/altar.png
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
